<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>経営ダッシュボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: 帳簿をめくる感覚の単一カラム。上に月送り、下に3タブ(HOME/結果/帳簿)。数字は明朝、操作は角ゴ。 */
:root{
  --bg:#eceee9; --surface:#f8f9f5; --ink:#1b2622; --muted:#62706a; --line:#d5dad2;
  --accent:#0d6a5a; --accent-soft:#d3e8e1; --amber:#b5650f; --neg:#b3372c; --warn-bg:#f6e3d6;
  --on-accent:#ffffff;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101715; --surface:#18211e; --ink:#e5ece8; --muted:#92a19a; --line:#2a3632;
    --accent:#4cc2a6; --accent-soft:#1d3a33; --amber:#e3a24e; --neg:#f2796d; --warn-bg:#3a2a20;
    --on-accent:#08201a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101715; --surface:#18211e; --ink:#e5ece8; --muted:#92a19a; --line:#2a3632;
  --accent:#4cc2a6; --accent-soft:#1d3a33; --amber:#e3a24e; --neg:#f2796d; --warn-bg:#3a2a20;
  --on-accent:#08201a; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px; min-height:100vh;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg)}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); padding:12px 0 10px; border-bottom:1px solid var(--line)}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand{font-family:var(--serif); font-weight:700; font-size:18px; letter-spacing:.04em}
.save{font-size:12px; color:var(--muted); margin-right:auto; padding-left:4px}
.xbtn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 12px; font-size:13px; font-weight:500; min-height:36px}
.stepper{display:flex; align-items:center; justify-content:space-between; margin-top:8px}
.stepper button{width:44px; height:40px; border:1px solid var(--line); background:var(--surface); border-radius:8px; font-size:18px; line-height:1}
.stepper .ym{font-family:var(--serif); font-weight:700; font-size:20px; letter-spacing:.06em}

main{padding-top:16px; max-width:640px; margin-inline:auto}
section[hidden]{display:none}
h2{font-family:var(--serif); font-size:20px; margin:0 0 4px; letter-spacing:.04em}
.sub{color:var(--muted); font-size:13px; margin:0 0 14px}
.eyebrow{font-size:12px; letter-spacing:.08em; color:var(--muted); margin:0 0 2px}

.banner{background:var(--accent-soft); border-radius:10px; padding:12px 14px; margin-bottom:16px; font-size:13px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.banner p{margin:0; flex:1 1 200px; min-width:0}
.btn{border:0; background:var(--accent); color:var(--on-accent); border-radius:8px; padding:9px 14px; font-weight:700; font-size:13px; min-height:40px}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn.danger{background:transparent; color:var(--neg); border:1px solid var(--neg)}

.glance{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:14px}
.glance div{min-width:0}
.glance .k{font-size:12px; color:var(--muted)}
.glance .v{font-family:var(--serif); font-weight:700; font-size:18px; white-space:nowrap}
.neg{color:var(--neg)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 12px 10px}
.seg{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap}
.seg button{border:1px solid var(--line); background:transparent; border-radius:999px; padding:5px 12px; font-size:13px; min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700}
.legend{display:flex; gap:14px; font-size:12px; color:var(--muted); margin:0 4px 6px; flex-wrap:wrap}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px}
.legend i.ln{height:3px; border-radius:2px; vertical-align:3px; width:16px}
#readout{font-size:13px; margin:0 4px 6px; min-height:20px}
#readout b{font-family:var(--serif)}
svg.chart{display:block; width:100%; height:auto}
svg.chart text{font-family:var(--sans); font-size:10px; fill:var(--muted)}
svg.chart .grid{stroke:var(--line); stroke-width:1}
svg.chart .zero{stroke:var(--muted); stroke-width:1}

.tablewrap{overflow-x:auto; margin-top:16px}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:340px}
th,td{padding:8px 6px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500; color:var(--muted); font-size:12px}
tr[data-m]{cursor:pointer}
tr.sel td{background:var(--accent-soft)}
td.empty{color:var(--muted)}
.unit{font-size:12px; color:var(--muted); margin:16px 0 0}

.metric{padding:14px 0; border-bottom:1px solid var(--line)}
.metric .big{font-family:var(--serif); font-weight:700; font-size:34px; line-height:1.2; letter-spacing:.01em}
.metric .delta{font-size:13px; color:var(--muted)}
.pill{display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent)}
.pill.warn{background:var(--warn-bg); color:var(--neg)}
.statusline{margin:14px 0 0}
.break{margin-top:18px}
.break h3{font-size:14px; margin:0 0 4px; font-weight:700}

.chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px}
.chips button{flex:0 0 auto; border:1px solid var(--line); background:transparent; border-radius:8px; padding:6px 12px; font-size:13px; min-height:38px; text-align:left; line-height:1.3}
.chips button b{display:block; font-family:var(--serif); font-size:15px}
.chips button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); min-height:50px}
.row .lab{min-width:0; flex:1 1 auto; font-size:14px}
.row .inp{display:flex; align-items:center; gap:6px; flex:0 0 52%}
.row input{width:100%; min-width:0; text-align:right; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 10px; font-size:16px; font-variant-numeric:tabular-nums; min-height:42px}
.row input[readonly]{background:transparent; border-color:transparent; padding-right:0}
.row i{font-style:normal; font-size:12px; color:var(--muted)}
.row.calc{background:transparent}
.row.calc .lab{color:var(--muted)}
.row.calc .val{font-family:var(--serif); font-weight:700; font-size:17px; white-space:nowrap}
.row.calc.strong .lab{color:var(--ink); font-weight:700}
.row.calc.strong .val{font-size:20px}
.kpis{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; min-width:0}
.kpi .k{font-size:12px; color:var(--muted)}
.kpi .v{font-family:var(--serif); font-weight:700; font-size:22px; overflow-wrap:anywhere}

nav{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface); border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(3,1fr);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav button{border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; color:var(--muted); min-height:52px; border-radius:8px}
nav button svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent); font-weight:700}

.xsheet{position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center}
.xsheet[hidden]{display:none}
.xbody{background:var(--surface); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); max-height:88vh; overflow-y:auto}
.xbody h3{font-family:var(--serif); margin:0 0 6px; font-size:18px}
.xbody p{margin:0 0 12px; font-size:13px; color:var(--muted)}
.xbody .stack{display:flex; flex-direction:column; gap:10px}
.xbody .btn{text-align:center}
#msg{min-height:20px; font-size:13px; margin:10px 0 0}
#msg.err{color:var(--neg)}
@media (prefers-reduced-motion: no-preference){ .metric .big,.kpi .v{transition:color .2s} }
</style>

<header>
  <div class="top">
    <div class="brand">経営ダッシュボード</div>
    <span class="save" id="saveState" aria-live="polite"></span>
    <button class="xbtn" id="openX" type="button">Excel</button>
  </div>
  <div class="stepper">
    <button type="button" id="prevM" aria-label="前の月">‹</button>
    <div class="ym" id="ym"></div>
    <button type="button" id="nextM" aria-label="次の月">›</button>
  </div>
</header>

<main>
  <div class="banner" id="sampleBanner" hidden>
    <p>いまの数字はサンプルです。自分の数字を入れるには、サンプルを消してください。Excelから読み込むこともできます。</p>
    <button class="btn" type="button" id="clearSample">サンプルを消して入力する</button>
  </div>

  <section id="v-home" aria-label="HOME">
    <p class="eyebrow">HOME</p>
    <h2 id="homeTitle">1年間の変動</h2>
    <p class="sub" id="homeSub"></p>
    <div class="glance" id="glance"></div>
    <div class="panel">
      <div class="seg" role="group" aria-label="グラフの切り替え">
        <button type="button" id="mPL" aria-pressed="true">売上と純利益</button>
        <button type="button" id="mBS" aria-pressed="false">現金と純資産</button>
      </div>
      <div class="legend" id="legend"></div>
      <div id="readout"></div>
      <div id="chart"></div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>月</th><th>売上</th><th>純利益</th><th>現金</th><th>純資産</th></tr></thead>
        <tbody id="ytable"></tbody>
      </table>
    </div>
    <p class="unit">単位は万円(四捨五入)。行をタップするとその月に移ります。</p>
  </section>

  <section id="v-result" aria-label="結果" hidden>
    <p class="eyebrow">結果</p>
    <h2 id="resTitle"></h2>
    <p class="sub">帳簿の入力から自動で計算します。</p>
    <div id="resMetrics"></div>
    <div class="statusline" id="resStatus"></div>
    <div class="break" id="resBreak"></div>
  </section>

  <section id="v-books" aria-label="毎月の経営管理" hidden>
    <p class="eyebrow">毎月の経営管理</p>
    <div class="chips" id="chips" role="group" aria-label="帳簿の選択"></div>
    <h2 id="bookTitle"></h2>
    <p class="sub" id="bookSub"></p>
    <div id="bookBody"></div>
  </section>
</main>

<nav aria-label="メイン">
  <button type="button" data-view="home" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.5V19h12v-8.5"/></svg>HOME</button>
  <button type="button" data-view="result">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9"/><path d="M12 19V5"/><path d="M19 19v-7"/></svg>結果</button>
  <button type="button" data-view="books">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h11a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6z"/><path d="M6 4v16"/><path d="M10 9h5M10 13h5"/></svg>帳簿</button>
</nav>

<div class="xsheet" id="xsheet" hidden>
  <div class="xbody" role="dialog" aria-modal="true" aria-labelledby="xt">
    <h3 id="xt">Excelと同期</h3>
    <p>書き出したExcelを編集して読み込み直すと、数字がこの画面に反映されます。Excelの計算式は書き出し時に入っています。</p>
    <div class="stack">
      <button class="btn" type="button" id="xExport">いまのデータをExcelに書き出す</button>
      <button class="btn ghost" type="button" id="xBlank">空のひな形を書き出す</button>
      <button class="btn ghost" type="button" id="xImportBtn">Excelから読み込む</button>
      <input type="file" id="xFile" accept=".xlsx,.xlsm" hidden>
      <button class="btn danger" type="button" id="xWipe">すべてのデータを消す</button>
      <button class="btn ghost" type="button" id="xClose">閉じる</button>
    </div>
    <div id="msg" role="status"></div>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var pad=function(n){return String(n).padStart(2,'0')};
var mk=function(y,m){return y+'-'+pad(m)};
var parseMk=function(k){var p=k.split('-').map(Number);return {y:p[0],m:p[1]}};
function addMonth(k,d){var o=parseMk(k),y=o.y,m=o.m+d;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return mk(y,m)}
function nowKey(){var d=new Date();return mk(d.getFullYear(),d.getMonth()+1)}

/* ---------- 帳簿の定義 ---------- */
var BOOKS={
 A:{t:'収入管理',s:'通販・厨房営業・法人営業の売上と入金',items:[
  {k:'a_ec',l:'通販売上'},{k:'a_kitchen',l:'厨房営業売上'},{k:'a_corp',l:'法人営業売上'},
  {c:'sales',l:'売上合計',strong:1},{k:'a_due',l:'入金予定'},{k:'a_paid',l:'実入金'},{c:'unreceived',l:'未入金(予定−実入金)'}]},
 B:{t:'利益管理',s:'売上原価から純利益まで',items:[
  {c:'sales',l:'売上合計'},{k:'b_cogs',l:'売上原価'},{c:'gross',l:'粗利益',strong:1},
  {k:'b_rent',l:'賃貸費'},{k:'b_labor',l:'人件費'},{k:'b_util',l:'通信光熱費'},{k:'b_exp',l:'経費'},
  {c:'net',l:'純利益',strong:1}]},
 C:{t:'支払・負債管理',s:'掛け払い、借入金、返済予定、未払金',items:[
  {k:'c_payable',l:'掛け払い'},{k:'c_loan',l:'借入金(残高)'},{k:'c_repay',l:'返済予定'},{k:'c_unpaid',l:'未払金'},
  {c:'liab',l:'負債合計(返済予定を除く)',strong:1}]},
 D:{t:'資産・投資管理',s:'商品在庫、不動産、株式、設備、投資損益',items:[
  {k:'d_stock',l:'商品在庫'},{k:'d_re',l:'不動産'},{k:'d_shares',l:'株式'},{k:'d_equip',l:'設備'},
  {c:'assets',l:'資産合計(現預金を除く)',strong:1},{k:'d_pl',l:'投資損益(参考・マイナス可)',neg:1}]},
 E:{t:'現金・資金繰り管理',s:'手元現金、銀行残高、入金予定、支払予定',items:[
  {k:'e_cash',l:'手元現金'},{k:'e_bank',l:'銀行残高'},{c:'cash',l:'現預金',strong:1},
  {c:'due',l:'入金予定(帳簿Aより)'},{k:'e_out',l:'支払予定'},
  {c:'forecast',l:'資金予測(現預金+入金予定−支払予定)'},{c:'shortage',l:'資金不足',strong:1}]},
 F:{t:'経営成績ダッシュボード',s:'この月の成績をまとめて確認',items:[]}
};
var ALLKEYS=[];
Object.keys(BOOKS).forEach(function(b){BOOKS[b].items.forEach(function(i){if(i.k)ALLKEYS.push(i.k)})});

/* ---------- 計算 ---------- */
function calc(m){
  m=m||{};
  var n=function(k){var v=Number(m[k]);return isFinite(v)?v:0};
  var sales=n('a_ec')+n('a_kitchen')+n('a_corp');
  var gross=sales-n('b_cogs');
  var net=gross-n('b_rent')-n('b_labor')-n('b_util')-n('b_exp');
  var cash=n('e_cash')+n('e_bank');
  var forecast=cash+n('a_due')-n('e_out');
  var assets=n('d_stock')+n('d_re')+n('d_shares')+n('d_equip');
  var liab=n('c_payable')+n('c_loan')+n('c_unpaid');
  var has=ALLKEYS.some(function(k){return n(k)!==0});
  return {sales:sales,gross:gross,net:net,grossRate:sales?gross/sales:0,netRate:sales?net/sales:0,
    cash:cash,due:n('a_due'),forecast:forecast,shortage:Math.max(0,-forecast),assets:assets,liab:liab,
    netAssets:cash+assets-liab,loan:n('c_loan'),invest:n('d_re')+n('d_shares')+n('d_equip'),
    unreceived:n('a_due')-n('a_paid'),has:has};
}

/* ---------- 表示用 ---------- */
function yen(v){var r=Math.round(v);return (r<0?'−':'')+'¥'+Math.abs(r).toLocaleString('ja-JP')}
function pct(v){return (v*100).toFixed(1)+'%'}
function man(v){return Math.round(v/10000).toLocaleString('ja-JP')}
function manS(v){var x=Math.abs(v)/10000;return (v<0?'−':'+')+x.toFixed(1)+'万円'}
function fmtCalc(key,v){
  if(key==='grossRate'||key==='netRate')return pct(v);
  if(key==='shortage'&&v===0)return 'なし';
  return yen(v);
}

/* ---------- 状態 ---------- */
var state={months:{},sample:true};
var cur=nowKey(), view='home', book='A', mode='pl';
var db=null, ref=null, saving=false, dirty=false, timer=null;

function makeSample(y,N){
  var ec=[82,79,91,88,95,102,110,98,105,112,108,121],ki=[168,172,185,190,201,215,222,208,219,226,231,246],co=[210,225,232,240,238,255,262,270,268,281,276,298];
  var o={};
  for(var i=0;i<N;i++){
    var w=1+Math.sin(i*1.7)*0.03, e=ec[i]*10000,k=ki[i]*10000,c=co[i]*10000,s=e+k+c;
    var due=Math.round(s*0.94/1000)*1000;
    o[mk(y,i+1)]={a_ec:e,a_kitchen:k,a_corp:c,a_due:due,a_paid:i===N-1?Math.round(due*0.82/1000)*1000:due,
      b_cogs:Math.round(s*0.41*w/1000)*1000,b_rent:380000,b_labor:1180000+i*12000,
      b_util:96000+Math.round(Math.sin(i)*9000),b_exp:160000+Math.round(Math.cos(i*1.3)*30000),
      c_payable:1250000+Math.round(Math.sin(i*2)*180000),c_loan:18000000-262000*i,c_repay:262000,
      c_unpaid:640000+Math.round(Math.cos(i)*90000),
      d_stock:2300000+Math.round(Math.sin(i*1.2)*300000),d_re:12000000,d_shares:3000000+i*60000,d_equip:4500000-i*55000,
      d_pl:Math.round(Math.sin(i*1.5)*90000+i*12000),
      e_cash:900000+Math.round(Math.sin(i*2.3)*150000),e_bank:6200000+i*610000+Math.round(Math.cos(i*1.1)*200000),
      e_out:2650000+Math.round(Math.sin(i*1.4)*120000)};
  }
  return o;
}
function loadSample(){
  var p=parseMk(cur);

/* ---------- 保存 ---------- */
function setSave(t){$('#saveState').textContent=t}
function localSave(){try{localStorage.setItem('keiei-v1',JSON.stringify(state.months))}catch(e){}}
function queueSave(){
  if(state.sample)return;
  setSave('保存中…'); dirty=true; localSave();
  clearTimeout(timer); timer=setTimeout(flush,700);
}
async function flush(){
  if(saving){return}
  if(!dirty)return;
  if(!ref){setSave('この端末に保存');dirty=false;return}
  saving=true; dirty=false;
  try{
    await ref.set({v:1,months:state.months,updatedAt:Date.now()});
    setSave('保存済み');
  }catch(e){setSave('この端末に保存(同期できませんでした)')}
  saving=false;
  if(dirty)flush();
}

}

function niceTicks(min,max){
  if(max<=min)max=min+1;
  var raw=(max-min)/4, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p;
  var step=(f<=1?1:f<=2?2:f<=5?5:10)*p;
  var lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(var v=lo;v<=hi+step/2;v+=step)t.push(Math.round(v*1e6)/1e6);
  return t;
}
function yearData(y){
  var out=[];
  for(var m=1;m<=12;m++){var d=calc(getM(mk(y,m)));out.push(d.has?d:null)}
  return out;
}

function chartSVG(a,b,selM,bars){
  var W=360,H=210,pl=42,pr=10,pt=16,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  var vals=[0].concat(a.filter(function(v){return v!==null}),b.filter(function(v){return v!==null}));
  var t=niceTicks(Math.min.apply(null,vals),Math.max.apply(null,vals));
  var lo=t[0],hi=t[t.length-1],band=iw/12;
  var y=function(v){return pt+(1-(v-lo)/(hi-lo))*ih};
  var x=function(i){return pl+band*(i+0.5)};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="1年間の月別グラフ">';
  s+='<text x="'+(pl-6)+'" y="9" text-anchor="end">万円</text>';
  t.forEach(function(v){
    s+='<line class="'+(v===0?'zero':'grid')+'" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/>';
    s+='<text x="'+(pl-6)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end">'+v.toLocaleString('ja-JP')+'</text>';
  });
  s+='<rect x="'+(pl+band*(selM-1)).toFixed(1)+'" y="'+pt+'" width="'+band.toFixed(1)+'" height="'+ih+'" fill="var(--accent-soft)" opacity=".55"/>';
  for(var i=0;i<12;i++){
    s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" style="'+(i+1===selM?'fill:var(--ink);font-weight:700':'')+'">'+(i+1)+'月</text>';
  }
  if(bars){
    var bw=band*0.5;
    a.forEach(function(v,i){
      if(v===null)return;
      var y0=y(0),y1=y(v);
      s+='<rect x="'+(x(i)-bw/2).toFixed(1)+'" y="'+Math.min(y0,y1).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,Math.abs(y0-y1)).toFixed(1)+'" rx="2" fill="var(--accent)"/>';
    });
  }else{
    s+=linePath(a,x,y,'var(--accent)');
  }
  s+=linePath(b,x,y,'var(--amber)');
  for(var j=0;j<12;j++){
    s+='<rect data-m="'+(j+1)+'" x="'+(pl+band*j).toFixed(1)+'" y="'+pt+'" width="'+band.toFixed(1)+'" height="'+ih+'" fill="transparent" style="cursor:pointer"/>';
  }
  return s+'</svg>';
}
function linePath(arr,x,y,col){
  var d='',pen=false,last=-1,s='';
  arr.forEach(function(v,i){
    if(v===null){pen=false;return}
    d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true;last=i;
  });
  if(!d)return '';
  s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  arr.forEach(function(v,i){
    if(v===null)return;
    s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="'+(i===last?4.5:2.6)+'" fill="'+col+'"'+(i===last?' stroke="var(--surface)" stroke-width="1.5"':'')+'/>';
  });
  return s;
}

/* ---------- 入力 ---------- */
function parseNum(s){
  s=String(s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)})
    .replace(/[−－ー―]/g,'-').replace(/[,，\s円¥]/g,'');
  if(s===''||s==='-')return undefined;
  var v=Number(s);return isFinite(v)?Math.round(v):undefined;
}
document.addEventListener('input',function(e){
  var el=e.target;
  if(!el.dataset||!el.dataset.k||state.sample)return;
  var v=parseNum(el.value);
  if(!state.months[cur])state.months[cur]={};
  if(v===undefined)delete state.months[cur][el.dataset.k];else state.months[cur][el.dataset.k]=v;
  renderBook(false); queueSave();
});
document.addEventListener('focusout',function(e){
  var el=e.target;
  if(!el.dataset||!el.dataset.k)return;
  var v=parseNum(el.value);
  el.value=v===undefined?'':v.toLocaleString('ja-JP');
});
document.addEventListener('click',function(e){
  var t=e.target, c;
  if((c=t.closest('[data-m]'))){var m=Number(c.dataset.m);cur=mk(parseMk(cur).y,m);renderAll(true);return}
  if((c=t.closest('[data-b]'))){book=c.dataset.b;renderAll(true);return}
  if((c=t.closest('nav button'))){setView(c.dataset.view);return}
});

 F:{name:'帳簿F_経営成績',head:['月','売上合計','粗利益率','純利益率','借入残高','投資額','現預金'],keys:[null,null,null,null,null,null,null]}
};
function q(n){return "'"+n+"'"}
function cellN(v,z){return v===undefined||v===null?undefined:{t:'n',v:v,z:z||'#,##0'}}
function cellF(f,v,z){return {t:'n',f:f,v:v,z:z||'#,##0'}}
function buildWorkbook(year,blank){
  var wb=XLSX.utils.book_new();
  var A=q(SH.A.name),Bn=q(SH.B.name),C=q(SH.C.name),D=q(SH.D.name),E=q(SH.E.name);
  var sheets=[];
  function add(name,head,fn,widths){
    var aoa=[head];
    for(var m=1;m<=12;m++){
      var r=m+1, mm=blank?{}:(state.months[mk(year,m)]||{}), d=calc(mm);
      aoa.push(fn(r,mm,d,year+'年'+m+'月'));
    }
    var ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=widths.map(function(w){return {wch:w}});
    ws['!freeze']={xSplit:1,ySplit:1};
    XLSX.utils.book_append_sheet(wb,ws,name);
  }
  var inp=function(mm,k,z){return cellN(mm[k],z)};
  add('HOME',['月','売上合計','純利益','現金残高','純資産'],function(r,mm,d,l){
    return [l,cellF(A+'!E'+r,d.sales),cellF(Bn+'!I'+r,d.net),cellF(E+'!D'+r,d.cash),cellF("'結果'!D"+r,d.netAssets)];
  },[12,14,14,14,14]);
  add('結果',['月','純利益','現金残高','純資産'],function(r,mm,d,l){
    return [l,cellF(Bn+'!I'+r,d.net),cellF(E+'!D'+r,d.cash),cellF(E+'!D'+r+'+'+D+'!G'+r+'-'+C+'!F'+r,d.netAssets)];
  },[12,14,14,14]);
  add(SH.A.name,SH.A.head,function(r,mm,d,l){
    return [l,inp(mm,'a_ec'),inp(mm,'a_kitchen'),inp(mm,'a_corp'),cellF('SUM(B'+r+':D'+r+')',d.sales),inp(mm,'a_due'),inp(mm,'a_paid'),cellF('F'+r+'-G'+r,d.unreceived)];
  },[12,13,15,15,13,13,13,13]);
  add(SH.B.name,SH.B.head,function(r,mm,d,l){
    return [l,cellF(A+'!E'+r,d.sales),inp(mm,'b_cogs'),cellF('B'+r+'-C'+r,d.gross),inp(mm,'b_rent'),inp(mm,'b_labor'),inp(mm,'b_util'),inp(mm,'b_exp'),cellF('D'+r+'-E'+r+'-F'+r+'-G'+r+'-H'+r,d.net)];
  },[12,13,13,13,12,12,13,12,13]);
  add(SH.C.name,SH.C.head,function(r,mm,d,l){
    return [l,inp(mm,'c_payable'),inp(mm,'c_loan'),inp(mm,'c_repay'),inp(mm,'c_unpaid'),cellF('B'+r+'+C'+r+'+E'+r,d.liab)];
  },[12,13,13,13,13,14]);
  add(SH.D.name,SH.D.head,function(r,mm,d,l){
    return [l,inp(mm,'d_stock'),inp(mm,'d_re'),inp(mm,'d_shares'),inp(mm,'d_equip'),inp(mm,'d_pl'),cellF('B'+r+'+C'+r+'+D'+r+'+E'+r,d.assets)];
  },[12,13,13,13,13,13,22]);
  add(SH.E.name,SH.E.head,function(r,mm,d,l){
    return [l,inp(mm,'e_cash'),inp(mm,'e_bank'),cellF('B'+r+'+C'+r,d.cash),cellF(A+'!F'+r,d.due),inp(mm,'e_out'),cellF('D'+r+'+E'+r+'-F'+r,d.forecast),cellF('MAX(0,-G'+r+')',d.shortage)];
  },[12,13,13,13,13,13,13,13]);
  add(SH.F.name,SH.F.head,function(r,mm,d,l){
    return [l,cellF(A+'!E'+r,d.sales),cellF('IF(B'+r+'=0,0,'+Bn+'!D'+r+'/B'+r+')',d.grossRate,'0.0%'),cellF('IF(B'+r+'=0,0,'+Bn+'!I'+r+'/B'+r+')',d.netRate,'0.0%'),cellF(C+'!C'+r,d.loan),cellF(D+'!C'+r+'+'+D+'!D'+r+'+'+D+'!E'+r,d.invest),cellF(E+'!D'+r,d.cash)];
  },[12,13,12,12,13,13,13]);
  return wb;
}
function say(t,err){var m=$('#msg');m.textContent=t;m.className=err?'err':''}
async function doExport(blank){
  if(!window.XLSX){say('Excel機能を読み込めませんでした。通信を確認して開き直してください。',1);return}
  var dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(!dl){say('この表示ではファイル保存が使えません。Claudeアプリかブラウザで開き直してください。',1);return}
  var year=parseMk(cur).y;
  try{
    var wb=buildWorkbook(year,blank);
    var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    await dl.save({filename:(blank?'経営ダッシュボード_ひな形_':'経営ダッシュボード_')+year+'.xlsx',data:new Blob([out])});
    say(blank?'ひな形を書き出しました。':'書き出しました。Excelで編集後、「Excelから読み込む」で戻せます。');
  }catch(e){
    say(e&&e.code==='declined'?'保存をやめました。':'書き出せませんでした。もう一度お試しください。',1);
  }
}
function importWorkbook(buf){
  var wb=XLSX.read(buf,{type:'array'}), count=0, firstKey=null;
  Object.keys(SH).forEach(function(b){
    var def=SH[b], ws=wb.Sheets[def.name];
    if(!ws)return;
    var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    var hi=-1;
    for(var i=0;i<rows.length;i++){if(rows[i]&&rows[i][0]==='月'){hi=i;break}}
    if(hi<0)return;
    var colOf={};
    rows[hi].forEach(function(h,j){if(h!==null)colOf[String(h).trim()]=j});
    for(var r=hi+1;r<rows.length;r++){
      var row=rows[r]; if(!row)continue;
      var mt=String(row[0]===null?'':row[0]).match(/(\d{4})\D+(\d{1,2})/);
      if(!mt)continue;
      var key=mk(Number(mt[1]),Number(mt[2]));
      def.keys.forEach(function(k,idx){
        if(!k)return;
        var j=colOf[def.head[idx]]; if(j===undefined)return;
        var raw=row[j];
        if(raw===null||raw==='')return;
        var v=Number(raw); if(!isFinite(v))return;
        if(!state.months[key])state.months[key]={};
        state.months[key][k]=Math.round(v);
        count++;
        if(!firstKey||key<firstKey)firstKey=key;
      });
    }
  });
  return {count:count,firstKey:firstKey};
}

(function(){
  var h=(location.hash||'').replace('#','');
  if(h==='result'||h==='books'||h==='home')view=h;
  loadSample();
  $$('nav button').forEach(function(b){if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  ['home','result','books'].forEach(function(x){$('#v-'+x).hidden=(x!==view)});
  renderAll(true);
  (async function(){
    var cl=window.claude, uid=null;
    try{
      if(cl&&cl.use){
        db=await cl.use('db');
        var user=await cl.use('user');
        uid=user?await user.id():null;
      }
    }catch(e){db=null}
    if(db&&uid){
      try{
        ref=db.doc('data/users/'+uid+'/ledger');
        var snap=await ref.get();
        if(snap.exists&&snap.data()&&snap.data().months){
          state={months:snap.data().months,sample:false};
          setSave('保存済み');renderAll(true);return;
        }
      }catch(e){ref=null}
    }
    try{
      var raw=localStorage.getItem('keiei-v1');
      if(raw){state={months:JSON.parse(raw),sample:false};setSave(ref?'保存済み':'この端末に保存');renderAll(true)}
    }catch(e){}
  })();
})();
})();
